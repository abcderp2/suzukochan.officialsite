name: Apply English copy and navigation updates

on:
  push:
    branches:
      - fix/20260806-en-copy-nav-settings

permissions:
  contents: write

concurrency:
  group: apply-en-copy-nav-once
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the work branch
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          umask 077
          git init .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -B "${BRANCH}" "refs/remotes/origin/${BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Apply and verify changes
        run: |
          python3 -I scripts/apply_en_copy_nav_once.py
          git rm scripts/apply_en_copy_nav_once.py .github/workflows/apply-en-copy-nav-once.yml
          python3 -I scripts/check_site.py
          python3 -I scripts/security_audit.py --history
          git diff --check

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git add index.html en.html assets/css/style.css scripts/check_site.py CHANGELOG.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refine English copy and navigation sizing"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
