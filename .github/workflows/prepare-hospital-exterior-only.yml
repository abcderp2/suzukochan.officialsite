          hospital_ja_old = '''      <div class="hospital-copy text-spacing">\n        <p class="no-margin-top">White Wing病院は、鈴子ちゃんの世界観に登場する架空の病院です。</p>\n        <p>「White Wing Hospital」「ホワイトウィング病院」「White Wing病院」は、いずれも公式表記です。主に「White Wing病院」を使用します。</p>\n        <p>建物は完全な平屋で、2階・地下階はない設定です。</p>\n        <p>公式背景ビジュアルは、White Wing病院の基本的な外観・院内デザインを示す基準資料です。</p>\n        <p>病院のシンボルマークは翼をモチーフにしています。背景との同化を避けて見やすくするため、通常は青い翼を使用しています。白い翼のマークも公式表現として使用できます。青い翼と白い翼は、どちらも公式のシンボルマークです。</p>\n        <p class="hospital-guideline-note">以下の4点はWhite Wing病院の公式背景ビジュアルです。利用条件は、当サイトの鈴子ちゃん利用ガイドラインと同じです。</p>\n      </div>'''

