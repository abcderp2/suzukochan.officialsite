540"\n              decoding="async"\n            >\n            <figcaption id="hospital-corridor-caption">院内廊下</figcaption>\n          </figure>\n        </div>\n        <figure class="hospital-card">\n          <a id="hospital-exam-room-thumb" class="hospital-thumb" href="#hospital-exam-room-lightbox" aria-controls="hospital-exam-room-lightbox" aria-label="診察室を拡大表示">\n            <img\n              src="assets/images/white-wing-hospital/04_whitewing_hospital_exam_room.webp"\n              alt="White Wing病院の診察室。診察用の机と椅子"\n              width="960"\n              height="720"\n              loading="lazy"\n              decoding="async"\n            >\n          </a>\n          <figcaption>診察室</figcaption>\n        </figure>\n        <div\n          id="hospital-exam-room-lightbox"\n          class="lightbox"\n          role="region"\n          aria-labelledby="hospital-exam-room-caption"\n        >\n          <a class="lightbox-backdrop" href="#hospital-exam-room-thumb" aria-label="拡大表示を閉じる" tabindex="-1"></a>\n          <figure class="lightbox-panel">\n            <a class="lightbox-close" href="#hospital-exam-room-thumb">閉じる</a>\n            <img\n              src="assets/images/white-wing-hospital/04_whitewing_hospital_exam_room.webp"\n              alt="White Wing病院の診察室。診察用の机と椅子"\n              width="960"\n              height="720"\n              decoding="async"\n            >\n            <figcaption id="hospital-exam-room-caption">診察室</figcaption>\n          </figure>\n        </div>\n      </div>'''

