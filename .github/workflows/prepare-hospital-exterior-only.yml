          r = r.replace("- CSSだけで動く画像拡大表示", "- CSSによるレスポンシブ表示")
          r = r.replace("PCではWhite Wing病院の画像を2列、画面の狭いスマートフォンでは1列で表示します。画像を押すと同じページ上で拡大し、閉じるリンクまたは背景のタップで戻れます。", "スマートフォン、タブレット、PCなど、画面幅に応じてレイアウトが調整されるレスポンシブな静的サイトです。White Wing病院では公式外観ビジュアルのみを掲載し、画像のクリックによる拡大表示は行いません。")
