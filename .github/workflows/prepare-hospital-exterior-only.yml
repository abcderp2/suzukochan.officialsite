          replace("index.html", hospital_ja_gallery_old, hospital_ja_gallery_new)
          replace("index.html", '<p><time datetime="2026-08-07">2026-08-07</time> プロフィール、White Wing病院設定、ガイドライン表記を軽微に更新</p>', '<p><time datetime="2026-08-27">2026-08-27</time> White Wing病院の公式外観ビジュアルのみを公開し、院内画像と画像拡大表示を整理</p>\n      <p><time datetime="2026-08-07">2026-08-07</time> プロフィール、White Wing病院設定、ガイドライン表記を軽微に更新</p>')
          replace("index.html", '<p class="no-margin-top">White Wing病院は、鈴子ちゃんの世界観に登場する架空の病院です。</p>\n        <p>「White Wing Hospital」「ホワイトウィング病院」「White Wing病院」は、いずれも公式表記です。主に「White Wing病院」を使用します。</p>\n        <p>建物は完全な平屋で、2階・地下階はない設定です。</p>\n        <p>公式背景ビジュアルは、White Wing病院の基本的な外観・院内デザインを示す基準資料です。</p>\n        <p>病院のシンボルマークは翼をモチーフにしています。背景との同化を避けて見やすくするため、通常は青い翼を使用しています。白い翼のマークも公式表現として使用できます。青い翼と白い翼は、どちらも公式のシンボルマークです。</p>', '<p class="no-margin-top">White Wing病院は、鈴子ちゃんの世界観に登場する架空の病院です。</p>\n        <p>「White Wing Hospital」「ホワイトウィング病院」「White Wing病院」は、いずれも公式表記です。主に「White Wing病院」を使用します。</p>\n        <p>建物は完全な平屋で、2階・地下階はない設定です。</p>\n        <p>公式外観ビジュアルは、White Wing病院の基本的な外観を示す公式資料です。</p>\n        <p>病院のシンボルマークは翼をモチーフにしています。背景との同化を避けて見やすくするため、通常は青い翼を使用しています。白い翼のマークも公式表現として使用できます。青い翼と白い翼は、どちらも公式のシンボルマークです。</p>')

          hospital_en_old = '''      <div class="hospital-copy text-spacing">\n        <p class="no-margin-top">White Wing Hospital is a fictional hospital in Suzuko-chan's world.</p>\n        <p>“White Wing Hospital,” “ホワイトウィング病院,” and “White Wing病院” are all official names. In Japanese, this site primarily uses “White Wing病院”; in English, it uses “White Wing Hospital.”</p>\n        <p>In the official setting, White Wing Hospital is a single-story building with no second floor or basement.</p>\n        <p>The official background visuals serve as reference materials for the hospital's basic exterior and interior design.</p>\n        <p>The hospital symbol is based on a wing motif. The blue-wing version is normally used because it remains easy to see against different backgrounds. A white-wing version is also official; both are approved variants of the symbol.</p>\n        <p class="hospital-guideline-note">The following four images are official background visuals for White Wing Hospital. The Suzuko-chan usage guidelines on this site apply to them as well.</p>\n      </div>'''

          hospital_en_new = '''      <div class="hospital-copy text-spacing">\n        <p class="no-margin-top">White Wing Hospital is a fictional hospital in Suzuko-chan's world.</p>\n        <p>“White Wing Hospital,” “ホワイトウィング病院,” and “White Wing病院” are all official names. In Japanese, this site primarily uses “White Wing病院”; in English, it uses “White Wing Hospital.”</p>\n        <p>In the official setting, White Wing Hospital is a single-story building with no second floor or basement.</p>\n        <p>The official exterior visual is the official reference for the basic appearance of White Wing Hospital.</p>\n        <p>The hospital symbol is based on a wing motif. The blue-wing version is normally used because it remains easy to see against different backgrounds. A white-wing version is also official; both are approved variants of the symbol.</p>\n        <p class="hospital-guideline-note">The following is the official exterior visual for White Wing Hospital. The Suzuko-chan usage guidelines on this site apply to it as well.</p>\n      </div>'''

          hospital_en_gallery_old = '''      <div class="hospital-gallery" aria-label="Official White Wing Hospital background visuals">\n        <figure class="hospital-card">\n          <a id="hospital-exterior-thumb" class="hospital-thumb" href="#hospital-exterior-lightbox" aria-controls="hospital-exterior-lightbox" aria-label="Enlarge hospital exterior">\n            <img\n              src="assets/images/white-wing-hospital/01_whitewing_hospital_exterior.webp"\n              alt="Exterior of White Wing Hospital, with a white building and blue wing symbol"\n              width="960"\n              height="540"\n              loading="lazy"\n              decoding="async"\n            >\n          </a>\n          <figcaption>Hospital exterior</figcaption>\n        </figure>\n        <div\n          id="hospital-exterior-lightbox"\n          class="lightbox"\n          role="region"\n          aria-labelledby="hospital-exterior-caption"\n        >\n          <a class="lightbox-backdrop" href="#hospital-exterior-thumb" aria-label="Close enlarged image" tabindex="-1"></a>\n          <figure class="lightbox-panel">\n            <a class="lightbox-close" href="#hospital-exterior-thumb">Close</a>\n            <img\n              src="assets/images/white-wing-hospital/01_whitewing_hospital_exterior.webp"\n              alt="Exterior of White Wing Hospital, with a white building and blue wing symbol"\n              width="960"\n              height="540"\n              decoding="async"\n            >\n            <figcaption id="hospital-exterior-caption">Hospital exterior</figcaption>\n          </figure>\n        </div>\n        <figure class="hospital-card">\n          <a id="hospital-lobby-thumb" class="hospital-thumb" href="#hospital-lobby-lightbox" aria-controls="hospital-lobby-lightbox" aria-label="Enlarge entrance lobby">\n            <img\n              src="assets/images/white-wing-hospital/02_whitewing_hospital_lobby.webp"\n              alt="Entrance lobby of White Wing Hospital, with reception and waiting areas"\n              width="960"\n              height="540"\n              loading="lazy"\n              decoding="async"\n            >\n          </a>\n          <figcaption>Entrance lobby</figcaption>\n        </figure>\n        <div\n          id="hospital-lobby-lightbox"\n          class="lightbox"\n          role="region"\n          aria-labelledby="hospital-lobby-caption"\n        >\n          <a class="lightbox-backdrop" href="#hospital-lobby-thumb" aria-label="Close enlarged image" tabindex="-1"></a>\n          <figure class="lightbox-panel">\n            <a class="lightbox-close" href="#hospital-lobby-thumb">Close</a>\n            <img\n              src="assets/images/white-wing-hospital/02_whitewing_hospital_lobby.webp"\n              alt="Entrance lobby of White Wing Hospital, with reception and waiting areas"\n              width="960"\n              height="540"\n              decoding="async"\n            >\n            <figcaption id="hospital-lobby-caption">Entrance lobby</figcaption>\n          </figure>\n        </div>\n        <figure class="hospital-card">\n          <a id="hospital-corridor-thumb" class="hospital-thumb" href="#hospital-corridor-lightbox" aria-controls="hospital-corridor-lightbox" aria-label="Enlarge hospital corridor">\n            <img\n              src="assets/images/white-wing-hospital/03_whitewing_hospital_corridor.webp"\n              alt="Interior corridor of White Wing Hospital leading to examination rooms"\n              width="960"\n              height="540"\n              loading="lazy"\n              decoding="async"\n            >\n          </a>\n          <figcaption>Hospital corridor</figcaption>\n        </figure>\n        <div\n          id="hospital-corridor-lightbox"\n          class="lightbox"\n          role="region"\n          aria-labelledby="hospital-corridor-caption"\n        >\n          <a class="lightbox-backdrop" href="#hospital-corridor-thumb" aria-label="Close enlarged image" tabindex="-1"></a>\n          <figure class="lightbox-panel">\n            <a class="lightbox-close" href="#hospital-corridor-thumb">Close</a>\n            <img\n              src="assets/images/white-wing-hospital/03_whitewing_hospital_corridor.webp"\n              alt="Interior corridor of White Wing Hospital leading to examination rooms"\n              width="960"\n              height="540"\n              decoding="async"\n            >\n            <figcaption id="hospital-corridor-caption">Hospital corridor</figcaption>\n          </figure>\n        </div>\n        <figure class="hospital-card">\n          <a id="hospital-exam-room-thumb" class="hospital-thumb" href="#hospital-exam-room-lightbox" aria-controls="hospital-exam-room-lightbox" aria-label="Enlarge examination room">\n            <img\n              src="assets/images/white-wing-hospital/04_whitewing_hospital_exam_room.webp"\n              alt="Examination room at White Wing Hospital, with a desk and chairs"\n              width="960"\n              height="720"\n              loading="lazy"\n              decoding="async"\n            >\n          </a>\n          <figcaption>Examination room</figcaption>\n        </figure>\n        <div\n          id="hospital-exam-room-lightbox"\n          class="lightbox"\n          role="region"\n          aria-labelledby="hospital-exam-room-caption"\n        >\n          <a class="lightbox-backdrop" href="#hospital-exam-room-thumb" aria-label="Close enlarged image" tabindex="-1"></a>\n          <figure class="lightbox-panel">\n            <a class="lightbox-close" href="#hospital-exam-room-thumb">Close</a>\n            <img\n              src="assets/images/white-wing-hospital/04_whitewing_hospital_exam_room.webp"\n              alt="Examination room at White Wing Hospital, with a desk and chairs"\n              width="960"\n              height="720"\n              decoding="async"\n            >\n            <figcaption id="hospital-exam-room-caption">Examination room</figcaption>\n          </figure>\n        </div>\n      </div>'''

          hospital_en_gallery_new = '''      <div class="hospital-gallery" aria-label="Official White Wing Hospital exterior visual">\n        <figure class="hospital-card">\n          <img\n            src="assets/images/white-wing-hospital/01_whitewing_hospital_exterior.webp"\n            alt="Exterior of White Wing Hospital, with a white building and blue wing symbol"\n            width="960"\n            height="540"\n            loading="lazy"\n            decoding="async"\n          >\n          <figcaption>Hospital exterior</figcaption>\n        </figure>\n      </div>'''

          replace("en.html", hospital_en_old, hospital_en_new)
          replace("en.html", hospital_en_gallery_old, hospital_en_gallery_new)
          replace("en.html", '<p><time datetime="2026-08-07">2026-08-07</time> Made minor updates to the profile, White Wing Hospital setting, and guidelines</p>', '<p><time datetime="2026-08-27">2026-08-27</time> Limited the official White Wing Hospital visual to the exterior and removed interior images and image enlargement</p>\n      <p><time datetime="2026-08-07">2026-08-07</time> Made minor updates to the profile, White Wing Hospital setting, and guidelines</p>')

          css = Path("assets/css/style.css")
          text = css.read_text(encoding="utf-8")
          lightbox_start = text.index(".lightbox{\n")
          lightbox_end = text.index(".sns-list{\n", lightbox_start)
          text = text[:lightbox_start] + text[lightbox_end:]
          text = text.replace(".hospital-gallery{\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 16px;\n  margin-top: 20px;\n}", ".hospital-gallery{\n  margin-top: 20px;\n}")
          text = text.replace(".hospital-card{\n  min-width: 0;\n  margin: 0;\n  text-align: center;\n}", ".hospital-card{\n  margin: 0;\n  text-align: center;\n}")
          text = text.replace(".hospital-thumb{\n  display: grid;\n  width: 100%;\n  aspect-ratio: 16 / 9;\n  place-items: center;\n  overflow: hidden;\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  background: #eef2f6;\n  text-decoration: none;\n  scroll-margin-top: 16px;\n}\n\n.hospital-thumb:hover{\n  border-color: rgba(0, 95, 204, 0.5);\n}\n\n.hospital-thumb:focus-visible,\n.hospital-thumb:target,\n.lightbox-close:focus-visible{\n  outline: 3px solid #005fcc;\n  outline-offset: 3px;\n}\n\n.hospital-thumb img{\n  display: block;\n  width: 100%;\n  height: 100%;\n  object-fit: contain;\n}", ".hospital-card img{\n  display: block;\n  width: 100%;\n  height: auto;\n  border: 1px solid var(--line);\n  border-radius: 10px;\n  background: #eef2f6;\n}")
          text = text.replace("\n@media (max-width: 700px){\n  .hospital-gallery{\n    grid-template-columns: 1fr;\n  }\n}\n", "\n")
          text = text.replace("\n@media (max-width: 480px){\n  .lightbox{\n    padding: 8px;\n  }\n\n  .lightbox-panel{\n    width: 100%;\n    padding: 50px 8px 8px;\n  }\n\n  .lightbox-panel img{\n    max-height: calc(100vh - 118px);\n    max-height: calc(100dvh - 118px);\n  }\n}\n", "\n")
          css.write_text(text.replace("style.css?v=20260806b", "style.css?v=20260827a"), encoding="utf-8")

          readme = Path("README.md")
          r = readme.read_text(encoding="utf-8")
