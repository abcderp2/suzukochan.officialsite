          hospital_ja_gallery_old = '''      <div class="hospital-gallery" aria-label="White Wing病院 公式背景ビジュアル">\n        <figure class="hospital-card">\n          <a id="hospital-exterior-thumb" class="hospital-thumb" href="#hospital-exterior-lightbox" aria-controls="hospital-exterior-lightbox" aria-label="病院外観を拡大表示">\n            <img\n              src="assets/images/white-wing-hospital/01_whitewing_hospital_exterior.webp"\n              alt="White Wing病院の外観。白い建物と青い翼のシンボルマーク"\n              width="960"\n              height="540"\n              loading="lazy"\n              decoding="async"\n            >\n          </a>\n          <figcaption>病院外観</figcaption>\n        </figure>\n        <div\n          id="hospital-exterior-lightbox"\n          class="lightbox"\n          role="region"\n          aria-labelledby="hospital-exterior-caption"\n        >\n          <a class="lightbox-backdrop" href="#hospital-exterior-thumb" aria-label="拡大表示を閉じる" tabindex="-1"></a>\n          <figure class="lightbox-panel">\n            <a class="lightbox-close" href="#hospital-exterior-thumb">閉じる</a>\n            <img\n              src="assets/images/white-wing-hospital/01_whitewing_hospital_exterior.webp"\n              alt="White Wing病院の外観。白い建物と青い翼のシンボルマーク"\n              width="960"\n              height="540"\n              decoding="async"\n            >\n            <figcaption id="hospital-exterior-caption">病院外観</figcaption>\n          </figure>\n        </div>\n        <figure class="hospital-card">\n          <a id="hospital-lobby-thumb" class="hospital-thumb" href="#hospital-lobby-lightbox" aria-controls="hospital-lobby-lightbox" aria-label="入口ホールを拡大表示">\n            <img\n              src="assets/images/white-wing-hospital/02_whitewing_hospital_lobby.webp"\n              alt="White Wing病院の入口ホール。受付と待合スペース"\n              width="960"\n              height="540"\n              loading="lazy"\n              decoding="async"\n            >\n          </a>\n          <figcap