name: Apply guideline and security updates

on:
  push:
    branches:
      - fix/20260806-guideline-security

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the work branch
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          EXPECTED_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          umask 077
          git init .
          git remote add origin "${SERVER_URL}/${REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout -B "${BRANCH}" "refs/remotes/origin/${BRANCH}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"

      - name: Apply and verify non-workflow changes
        run: |
          set -euo pipefail
          python3 -I scripts/apply_guideline_security_once.py
          git checkout HEAD -- .github/workflows/check-site.yml
          rm scripts/apply_guideline_security_once.py
          git add -A
          mv .github/workflows/apply-guideline-security.yml "${RUNNER_TEMP}/apply-guideline-security.yml"
          python3 -I scripts/check_site.py
          mv "${RUNNER_TEMP}/apply-guideline-security.yml" .github/workflows/apply-guideline-security.yml
          python3 -I scripts/security_audit.py --history
          git diff --cached --check

      - name: Commit and push non-workflow changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Clarify official image and derivative work rules"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git"
          git push origin "HEAD:${BRANCH}"
