name: temporary-footer-fix
on:
  push:
    branches:
      - fix/footer-official-links
permissions:
  contents: write
jobs:
  apply:
    if: ${{ github.event.head_commit.message != 'Fix footer official links' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply footer changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          url='https://sp.nicovideo.jp/user/141613837/shorts?sortKey=registeredAt&sortOrder=desc'
          ja=Path('index.html'); en=Path('en.html'); readme=Path('README.md'); asset=Path('ASSET_SOURCES.md')
          def apply(path, old, new, label, logo_alt):
              s=path.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'{path}: expected marker missing: {old}')
              s=s.replace(old,new,1)
              if 'href="'+url+'"' in s:
                  raise SystemExit(f'{path}: niconico link already present')
              marker='      </div>\n    </section>\n\n    <p class="back-to-top">'
              block=f'''        <div class="sns-item">\n          <a\n            class="sns-link"\n            href="{url}"\n            target="_blank"\n            rel="noopener noreferrer"\n          >\n            <img\n              class="service-logo"\n              src="assets/images/logos/niconico.svg"\n              alt="{logo_alt}"\n              width="40"\n              height="32"\n              loading="lazy"\n              decoding="async"\n            >\n            <span class="sns-copy">\n              <span class="sns-service">{label}</span>\n            </span>\n          </a>\n        </div>\n'''
              if marker not in s:
                  raise SystemExit(f'{path}: footer insertion marker missing')
              s=s.replace(marker,block+marker,1)
              path.write_text(s,encoding='utf-8')
          apply(ja,'<span class="sns-name">鈴子ちゃん公式</span>','<span class="sns-name">鈴子ちゃん</span>','ニコニコ動画','ニコニコ動画 ロゴ')
          apply(en,'<span class="sns-name">Suzuko-chan Official</span>','<span class="sns-name">Suzuko-chan</span>','Niconico','Niconico logo')
          r=readme.read_text(encoding='utf-8')
          r=r.replace('- X 鈴子ちゃん公式: https://x.com/suzuko_ai_','- X 鈴子ちゃん: https://x.com/suzuko_ai_',1)
          if url not in r:
              r=r.replace('- GitHub: https://github.com/abcderp2/suzukochan.officialsite\n','- GitHub: https://github.com/abcderp2/suzukochan.officialsite\n- ニコニコ動画: '+url+'\n',1)
          readme.write_text(r,encoding='utf-8')
          rows=asset.read_text(encoding='utf-8').splitlines()
          if not any('niconico.svg' in x for x in rows):
              last=max(i for i,x in enumerate(rows) if x.startswith('|'))
              cols=[c.strip() for c in rows[last].split('|')[1:-1]]
              vals=['']*len(cols)
              headers=[]
              for j in range(last-1,-1,-1):
                  if rows[j].startswith('|') and '---' not in rows[j]:
                      headers=[c.strip().lower() for c in rows[j].split('|')[1:-1]]
                      break
              for i,h in enumerate(headers[:len(vals)]):
                  if 'サービス' in h or 'service' in h: vals[i]='Niconico'
                  elif 'ファイル' in h or 'file' in h or 'path' in h: vals[i]='assets/images/logos/niconico.svg'
                  elif '出典' in h or 'source' in h: vals[i]='https://www.svgrepo.com/svg/331502/niconico'
                  elif '確認先' in h or 'official' in h or 'brand' in h: vals[i]='https://x.com/nico_nico_info/status/1630408699666894848'
                  elif '用途' in h or 'use' in h: vals[i]='Footer official link logo'
                  elif '確認日' in h or 'date' in h: vals[i]='2026-08-15'
                  elif 'ライセンス' in h or 'license' in h: vals[i]='CC0'
                  elif 'sha' in h: vals[i]=''
              rows.insert(last+1,'| '+' | '.join(vals)+' |')
              asset.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          PY
          curl -L --fail --silent --show-error https://www.svgrepo.com/show/331502/niconico.svg -o assets/images/logos/niconico.svg
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ASSET_SOURCES.md')
          s=p.read_text(encoding='utf-8')
          sha=''
          import subprocess
          sha=subprocess.check_output(['git','hash-object','assets/images/logos/niconico.svg'],text=True).strip()
          lines=s.splitlines()
          for i,line in enumerate(lines):
              if 'assets/images/logos/niconico.svg' in line:
                  cells=[c.strip() for c in line.split('|')[1:-1]]
                  for j,h in enumerate(reversed(lines[:i])):
                      if h.startswith('|') and '---' not in h:
                          headers=[c.strip().lower() for c in h.split('|')[1:-1]]
                          for k,hdr in enumerate(headers):
                              if 'sha' in hdr and k<len(cells): cells[k]=sha
                          lines[i]='| '+' | '.join(cells)+' |'
                          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
                          raise SystemExit
          PY
          rm .github/workflows/temporary-footer-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en.html README.md ASSET_SOURCES.md assets/images/logos/niconico.svg .github/workflows/temporary-footer-fix.yml
          git commit -m 'Fix footer official links'
          git push origin HEAD:fix/footer-official-links
