name: Precise update history cleanup
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove obsolete responsive-display wording
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              'index.html': '。スマートフォン、タブレット、PCなど各種デバイスでの表示に対応',
              'en.html': ', and confirmed responsive display for smartphones, tablets, PCs, and other devices',
          }
          for name, old in replacements.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old, '', 1), encoding='utf-8')
          Path('.github/workflows/remove-responsive-update-note.yml').unlink()
          PY
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html en.html .github/workflows/remove-responsive-update-note.yml
          git commit -m 'fix: remove obsolete responsive update note'
          git push